name: RAG framework CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: "just-a-placeholder"
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
      EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL || 'text-embedding-3-small' }}
      CHROMA_PATH: ${{ vars.CHROMA_PATH || './data/chroma' }}
      LANGSMITH_TRACING: ${{ vars.LANGSMITH_TRACING || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Run deterministic tests
        run: >-
          python -m pytest -q tests/
          -k "not test_agent_selects_ticket_tool and not test_agent_selects_retrieval_tool"

  live-agent-tests:
    if: >-
      ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
      EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL || 'text-embedding-3-small' }}
      CHROMA_PATH: ${{ vars.CHROMA_PATH || './data/chroma' }}
      LANGSMITH_TRACING: ${{ vars.LANGSMITH_TRACING || 'false' }}
      LANGSMITH_PROJECT: ${{ vars.LANGSMITH_PROJECT || 'rag-agent-ci' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Verify OpenAI secret is configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Configure OPENAI_API_KEY in repository Actions secrets."
            exit 1
          fi
      - run: pip install -r requirements.txt
      - name: Check OpenAI API connectivity
        run: |
          status=$(curl -sS -o /dev/null --connect-timeout 15 --max-time 30 \
            -w '%{http_code}' https://api.openai.com/v1/models || true)
          if [ "$status" = "000" ]; then
            echo "::error::GitHub runner could not connect to api.openai.com."
            exit 1
          fi
          echo "OpenAI endpoint reachable (HTTP $status; 401 is expected without credentials)."
      - name: Run live agent tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          clean_key="$(printf '%s' "$OPENAI_API_KEY" | tr -d '[:space:]')"
          if [ -z "$clean_key" ]; then
            echo "::error::OPENAI_API_KEY is empty after whitespace cleanup.";
            exit 1
          fi
          export OPENAI_API_KEY="$clean_key"
          python -m pytest -q tests/test_agent_tools.py \
            -k "test_agent_selects_ticket_tool or test_agent_selects_retrieval_tool"
