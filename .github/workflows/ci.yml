
name: RAG Framework CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Job 1: Code validation and unit tests
  code-quality:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Validate Python syntax
        run: python -m compileall -q app scripts tests

      - name: Run unit tests
        run: |
          mkdir -p reports
          python -m pytest tests/ -v \
            -k "not test_agent_selects_ticket_tool and not test_agent_selects_retrieval_tool" \
            --junitxml=reports/unit-results.xml

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: reports/
          if-no-files-found: ignore

  # Job 2: Live LLM and LangGraph tests
  agent-tests:
    name: Live Agent Integration Tests
    needs: code-quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Live tests need secrets, so skip only fork pull requests.
    if: >-
        ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}

    env:
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
      EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL || 'text-embedding-3-small' }}
      CHROMA_PATH: ./data/chroma
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_TRACING: "false"
      LANGSMITH_PROJECT: rag-agent-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate OpenAI secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          clean_key="$(printf '%s' "$OPENAI_API_KEY" | tr -d '[:space:]')"
          if [ -z "$clean_key" ]; then
            echo "::error::OPENAI_API_KEY is missing or empty after whitespace cleanup."
            exit 1
          fi
          echo "::add-mask::$clean_key"
          printf 'OPENAI_API_KEY=%s\n' "$clean_key" >> "$GITHUB_ENV"

      - name: Create report directory
        run: mkdir -p reports

      - name: Ingest demo policy for retrieval test
        run: python -m scripts.ingest_demo

      - name: Run LangGraph agent tests
        run: |
          python -m pytest \
            tests/test_agent_tools.py \
            -v \
            -k "test_agent_selects_ticket_tool or test_agent_selects_retrieval_tool" \
            --junitxml=reports/agent-results.xml

      - name: Upload agent test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-test-results
          path: reports/
          if-no-files-found: ignore